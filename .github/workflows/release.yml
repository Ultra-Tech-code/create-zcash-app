name: Release (npm)

# Action versions are the current majors, all of which run on Node 24 (checked against each
# action's action.yml and release notes): actions/checkout@v7, actions/setup-node@v7,
# actions/upload-artifact@v7, actions/download-artifact@v8, pnpm/action-setup@v6. Node 24 actions
# need runner >= 2.327.1, which GitHub-hosted runners satisfy. download-artifact@v8 fails the run on
# an artifact digest mismatch by default (previously a warning).

# Manual only. Nothing here runs on push or on a tag, so publishing is always a deliberate action.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only run `npm publish --dry-run` (nothing is published)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

env:
  # The four published packages are versioned in lockstep; `next` keeps the prerelease off `latest`.
  NPM_TAG: next

jobs:
  build:
    name: build - ${{ matrix.settings.target }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm --filter @zcash-app/core run build --target aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: pnpm --filter @zcash-app/core run build --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm --filter @zcash-app/core run build --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build: pnpm --filter @zcash-app/core run build --target aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm --filter @zcash-app/core run build --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.3
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Set RUSTFLAGS for deterministic build path remapping
        shell: bash
        run: |
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix ${{ github.workspace }}=/build --remap-path-prefix ${CARGO_DIR}=/cargo" >> "$GITHUB_ENV"

      - name: Build Rust core addon
        run: ${{ matrix.settings.build }}

      - name: Upload native addon
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/core/*.node
          if-no-files-found: error

  publish:
    name: publish - ${{ inputs.dry_run && 'dry run' || 'npm' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup node (trusted publishing)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm version for trusted publishing
        run: |
          npm_v=$(npm --version)
          echo "npm version: $npm_v"
          node -e '
            const v = process.argv[1].split(".").map(Number);
            if (v[0] < 11 || (v[0] === 11 && (v[1] < 5 || (v[1] === 5 && v[2] < 1)))) {
              console.error(`::error::npm >= 11.5.1 required for trusted publishing, found ${process.argv[1]}`);
              process.exit(1);
            }
          ' "$npm_v"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.3
          run_install: false

      - name: Install dependencies
        run: pnpm install

      # This step MUST stay before the `napi create-npm-dirs` / `napi artifacts` / `napi prepublish`
      # steps below. `napi prepublish` rewrites packages/core/package.json, adding the five platform
      # packages as optionalDependencies, which leaves pnpm-lock.yaml out of date. Every later
      # `pnpm run`/`pnpm exec` then runs pnpm's dependency check first (runDepsStatusCheck), which
      # in CI installs with --frozen-lockfile and fails with:
      #
      #   ERR_PNPM_OUTDATED_LOCKFILE: Cannot install with "frozen-lockfile" because pnpm-lock.yaml
      #   is not up to date with <ROOT>/packages/core/package.json
      #   * 5 dependencies were added: @zcash-app/core-darwin-arm64@0.1.0-alpha.0, ...
      #
      # (that is exactly how the first dry run failed). `pnpm pack` and `pnpm publish` do not run
      # that check — measured locally — so every step after prepublish is only `node`, `pnpm pack`
      # or `pnpm publish`, and no `verify-deps-before-run=false` override is needed. Do not add a
      # `pnpm run`/`pnpm exec` step after prepublish.
      - name: Build the TypeScript packages that get published
        # sdk first: zcash-dev imports @zcash-app/sdk's types from dist/.
        run: |
          pnpm --filter @zcash-app/sdk build
          pnpm --filter zcash-dev build
          pnpm --filter create-zcash-app build

      - name: Download every native addon
        uses: actions/download-artifact@v8
        with:
          path: packages/core/artifacts

      - name: Create the per-platform npm package directories
        run: pnpm --filter @zcash-app/core exec napi create-npm-dirs

      - name: Place the addons into the per-platform packages
        run: |
          pnpm --filter @zcash-app/core exec napi artifacts --output-dir artifacts
          ls -la packages/core/npm/*/*.node

      - name: Copy LICENSE into all packages
        run: |
          for dir in packages/core packages/sdk packages/dev packages/cli packages/core/npm/*/; do
            cp LICENSE "$dir/"
          done

      # @napi-rs/cli declares `ghRelease = Option.Boolean("--gh-release", true, ...)`, so creating a
      # GitHub release and publishing the per-platform packages are BOTH on by default: the
      # prepublish body wraps `createGhRelease(...)` around `if (!options.skipOptionalPublish)
      # execSync(`${npmClient} publish`)`. Passing --skip-optional-publish keeps publishing under
      # this workflow's control (order, --access, --tag), and --no-gh-release stops it from trying
      # to create a release. Both flags verified against the installed @napi-rs/cli 3.10.8.
      - name: Update package.json and copy addons (napi prepublish)
        run: >-
          pnpm --filter @zcash-app/core exec napi prepublish --tag-style npm
          --skip-optional-publish --no-gh-release

      # A silent prepublish failure would publish @zcash-app/core with no platform packages at all,
      # so check the manifest it is supposed to have rewritten. The manifest path is an argument so
      # the check can be exercised against a fixture locally.
      - name: Verify prepublish wired the platform packages into @zcash-app/core
        run: |
          set -euo pipefail
          manifest="${1:-packages/core/package.json}"
          node - "$manifest" <<'NODE'
          const fs = require('fs');
          const manifestPath = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const targets = (manifest.napi && manifest.napi.targets) || [];
          const optional = Object.keys(manifest.optionalDependencies || {});
          const missing = targets.filter((target) => {
            const suffix = target
              .replace('aarch64-apple-darwin', 'darwin-arm64')
              .replace('x86_64-apple-darwin', 'darwin-x64')
              .replace('x86_64-unknown-linux-gnu', 'linux-x64-gnu')
              .replace('aarch64-unknown-linux-gnu', 'linux-arm64-gnu')
              .replace('x86_64-pc-windows-msvc', 'win32-x64-msvc');
            return !optional.includes(`${manifest.name}-${suffix}`);
          });
          console.log(`napi targets: ${targets.length}, optionalDependencies: ${optional.length}`);
          optional.forEach((name) => console.log(`  ${name}`));
          if (targets.length === 0 || missing.length > 0) {
            console.error(`MISSING platform packages: ${missing.join(', ') || '(no targets)'}`);
            process.exit(1);
          }
          NODE

      - name: Pack every package and check the tarballs
        # npm pack leaves `workspace:*` in the published manifest (measured: @zcash-app/sdk packs
        # "@zcash-app/core": "workspace:*" with npm and "0.1.0-alpha.0" with pnpm), so publishing
        # has to go through pnpm. This step fails before anything is published if a manifest still
        # carries a workspace: range or if a payload file is missing.
        #
        # The native addons are NOT in the root @zcash-app/core tarball: `napi artifacts` copies
        # each zcash-core.<target>.node into packages/core/npm/<platform>/, and those per-platform
        # packages are what @zcash-app/core lists as optionalDependencies. So check the addon
        # directories (exactly one .node each) and check that the root core tarball holds none,
        # which is what would happen if the addon were duplicated into the loader package.
        run: |
          set -euo pipefail
          rm -rf /tmp/release-packs
          mkdir -p /tmp/release-packs
          pnpm --filter @zcash-app/core pack --pack-destination /tmp/release-packs
          pnpm --filter @zcash-app/sdk pack --pack-destination /tmp/release-packs
          pnpm --filter zcash-dev pack --pack-destination /tmp/release-packs
          pnpm --filter create-zcash-app pack --pack-destination /tmp/release-packs
          for dir in packages/core/npm/*/; do
            (cd "$dir" && pnpm pack --pack-destination /tmp/release-packs)
          done
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          // Platform addon packages, checked on disk: `napi artifacts` has already copied the
          // downloaded bindings into these directories.
          const NPM_PLATFORM = {
            'aarch64-apple-darwin': 'darwin-arm64',
            'x86_64-apple-darwin': 'darwin-x64',
            'x86_64-unknown-linux-gnu': 'linux-x64-gnu',
            'aarch64-unknown-linux-gnu': 'linux-arm64-gnu',
            'x86_64-pc-windows-msvc': 'win32-x64-msvc',
          };
          const coreManifest = JSON.parse(fs.readFileSync('packages/core/package.json', 'utf8'));
          const targets = (coreManifest.napi && coreManifest.napi.targets) || [];
          let platformFailures = 0;
          for (const target of targets) {
            const platform = NPM_PLATFORM[target] || target;
            const dir = path.join('packages/core/npm', platform);
            if (!fs.existsSync(dir)) {
              console.error(`MISSING platform package directory: ${dir}`);
              platformFailures++;
              continue;
            }
            const addons = fs.readdirSync(dir).filter((f) => f.endsWith('.node'));
            if (addons.length !== 1) {
              console.error(
                `EXPECTED exactly one addon in ${dir}, found ${addons.length}: ${addons.join(', ') || '(none)'}`
              );
              platformFailures++;
              continue;
            }
            console.log(`platform addon: ${dir}/${addons[0]}`);
          }
          if (targets.length === 0) {
            console.error('MISSING napi targets in packages/core/package.json');
            platformFailures++;
          }
          if (platformFailures > 0) process.exit(1);

          const tarballs = fs.readdirSync('/tmp/release-packs').filter((f) => f.endsWith('.tgz'));
          if (tarballs.length !== 9) {
            console.error(`EXPECTED exactly 9 tarballs in /tmp/release-packs, found ${tarballs.length}`);
            process.exit(1);
          }

          const expectedUrl = 'git+https://github.com/Ultra-Tech-code/create-zcash-app.git';
          let failures = 0;

          // Check that every one of the 9 tarballs has license, repository.url, a LICENSE file,
          // and zero workspace: ranges
          for (const file of tarballs) {
            const full = path.join('/tmp/release-packs', file);
            const listing = execSync(`tar -tzf ${full}`, { encoding: 'utf8' }).split('\n').filter(Boolean);
            const manifest = JSON.parse(
              execSync(`tar -xzOf ${full} package/package.json`, { encoding: 'utf8' })
            );

            if (manifest.license !== 'Apache-2.0') {
              console.error(`INVALID LICENSE in ${file}: expected Apache-2.0, found ${manifest.license}`);
              failures++;
            }
            if (!manifest.repository || manifest.repository.url !== expectedUrl) {
              console.error(
                `INVALID REPOSITORY in ${file}: expected ${expectedUrl}, found ${manifest.repository ? manifest.repository.url : undefined}`
              );
              failures++;
            }
            if (!listing.includes('package/LICENSE')) {
              console.error(`MISSING package/LICENSE in ${file}`);
              failures++;
            }
            const workspaceRanges = Object.entries({
              ...(manifest.dependencies || {}),
              ...(manifest.optionalDependencies || {}),
              ...(manifest.peerDependencies || {}),
              ...(manifest.devDependencies || {}),
            }).filter(([, range]) => String(range).includes('workspace:'));
            if (workspaceRanges.length > 0) {
              console.error(
                `WORKSPACE RANGE IN ${file}: ` + workspaceRanges.map(([n, r]) => `${n}=${r}`).join(', ')
              );
              failures++;
            }
            console.log(`tarball check ok: ${file} (workspace ranges: 0, license: ${manifest.license})`);
          }

          const expected = [
            { pattern: /^zcash-app-core-\d/, isCore: true, entries: ['package/index.js', 'package/index.d.ts'] },
            { pattern: /^zcash-app-sdk-\d/, entries: ['package/dist/index.js', 'package/dist/index.d.ts'] },
            { pattern: /^zcash-dev-\d/, entries: ['package/dist/cli.js', 'package/dist/index.js'] },
            { pattern: /^create-zcash-app-\d/, entries: ['package/dist/index.js', 'package/template/package.json.tmpl'] },
          ];

          for (const { pattern, isCore, entries } of expected) {
            const file = tarballs.find((f) => pattern.test(f));
            if (!file) {
              console.error(`MISSING TARBALL: nothing matching ${pattern}`);
              failures++;
              continue;
            }
            const full = path.join('/tmp/release-packs', file);
            const listing = execSync(`tar -tzf ${full}`, { encoding: 'utf8' }).split('\n');
            const manifest = JSON.parse(
              execSync(`tar -xzOf ${full} package/package.json`, { encoding: 'utf8' })
            );
            for (const entry of entries) {
              if (!listing.includes(entry)) {
                console.error(`MISSING ${entry} in ${file}`);
                failures++;
              }
            }
            if (isCore && listing.some((l) => l.endsWith('.node'))) {
              console.error(
                `UNEXPECTED native addon in ${file}: addons belong in the per-platform packages, ` +
                  'not duplicated into the loader package'
              );
              failures++;
            }
            const workspaceRanges = Object.entries({
              ...(manifest.dependencies || {}),
              ...(manifest.optionalDependencies || {}),
              ...(manifest.peerDependencies || {}),
              ...(manifest.devDependencies || {}),
            }).filter(([, range]) => String(range).includes('workspace:'));
            if (workspaceRanges.length > 0) {
              console.error(
                `WORKSPACE RANGE IN ${file}: ` + workspaceRanges.map(([n, r]) => `${n}=${r}`).join(', ')
              );
              failures++;
            }
            console.log(
              `${file}: ${manifest.name}@${manifest.version}, ${listing.length} entries, ` +
                `${(manifest.optionalDependencies ? Object.keys(manifest.optionalDependencies).length : 0)} optional deps`
            );
          }
          if (failures > 0) process.exit(1);
          NODE

      - name: Check that the four published packages share one version
        run: |
          node -e '
            const fs = require("fs");
            const names = ["core", "sdk", "dev", "cli"];
            const versions = names.map((n) => {
              const p = JSON.parse(fs.readFileSync(`packages/${n}/package.json`, "utf8"));
              console.log(`${p.name} ${p.version}`);
              return p.version;
            });
            if (new Set(versions).size !== 1) {
              console.error("::error::Package versions differ: " + versions.join(", "));
              process.exit(1);
            }
            console.log("All publishable packages are at " + versions[0]);
          '

      # Publish the 9 tarballs already produced by pnpm pack in /tmp/release-packs.
      # Because they were packed by pnpm pack, all workspace:* ranges were rewritten to real versions.
      # Publishing the packed tarballs directly via npm publish with --tag next uses npm's trusted
      # publishing (OIDC) without needing secrets.NPM_TOKEN or pnpm publish.
      - name: Publish the per-platform packages first
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args="--access public --tag ${NPM_TAG:-next}"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          for dir in packages/core/npm/*/; do
            pkg_name=$(node -p "require('./$dir/package.json').name.replace('@', '').replace('/', '-')")
            tarball=$(ls -1 /tmp/release-packs/${pkg_name}-*.tgz)
            echo "::group::npm publish $tarball"
            npm publish "$tarball" $args
            echo "::endgroup::"
          done

      - name: Publish @zcash-app/core
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args="--access public --tag ${NPM_TAG:-next}"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          tarball=$(node -e '
            const fs = require("fs");
            const f = fs.readdirSync("/tmp/release-packs").find((f) => /^zcash-app-core-\d/.test(f));
            if (!f) { console.error("core tarball not found"); process.exit(1); }
            console.log("/tmp/release-packs/" + f);
          ')
          echo "::group::npm publish $tarball"
          npm publish "$tarball" $args
          echo "::endgroup::"

      - name: Publish @zcash-app/sdk, zcash-dev and create-zcash-app
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args="--access public --tag ${NPM_TAG:-next}"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          for pattern in '^zcash-app-sdk-\d' '^zcash-dev-\d' '^create-zcash-app-\d'; do
            tarball=$(node -e '
              const fs = require("fs");
              const re = new RegExp(process.argv[1]);
              const f = fs.readdirSync("/tmp/release-packs").find((f) => re.test(f));
              if (!f) { console.error("tarball not found matching " + process.argv[1]); process.exit(1); }
              console.log("/tmp/release-packs/" + f);
            ' "$pattern")
            echo "::group::npm publish $tarball"
            npm publish "$tarball" $args
            echo "::endgroup::"
          done

      - name: Summarise
        if: always()
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: every npm publish was invoked with --dry-run, so nothing was published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published the platform packages, then @zcash-app/core, @zcash-app/sdk, zcash-dev and create-zcash-app with dist-tag \`${NPM_TAG:-next}\`." >> "$GITHUB_STEP_SUMMARY"
          fi
