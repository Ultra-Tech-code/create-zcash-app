name: CI & Native Addon Matrix
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '**/.gitignore'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm --filter @zcash-app/core run build --target aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: pnpm --filter @zcash-app/core run build --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm --filter @zcash-app/core run build --target x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm --filter @zcash-app/core run build --target x86_64-pc-windows-msvc

    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.3
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Set RUSTFLAGS for deterministic build path remapping
        shell: bash
        run: |
          CARGO_DIR="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix ${{ github.workspace }}=/build --remap-path-prefix ${CARGO_DIR}=/cargo" >> "$GITHUB_ENV"

      - name: Build Rust core addon
        run: ${{ matrix.settings.build }}

      - name: Test Rust crate
        run: cargo test
        working-directory: packages/core

      - name: Build TypeScript packages
        run: |
          pnpm --filter @zcash-app/sdk run build
          pnpm --filter zcash-dev run build
          pnpm --filter create-zcash-app run build

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/core/*.node
          if-no-files-found: error

  verify:
    # Mirrors the non-native checks in scripts/verify.sh so CI fails on the same things a
    # local run fails on. One Linux runner is enough; the matrix above covers the platforms.
    name: verify - scripts/verify.sh parity (linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.3
          run_install: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: pnpm install

      - name: Build Rust core addon (host target)
        run: pnpm --filter @zcash-app/core run build --target x86_64-unknown-linux-gnu

      - name: Cargo clippy
        run: cargo clippy --manifest-path packages/core/Cargo.toml --all-targets -- -D warnings

      - name: Install sqlite3 CLI (the SDK tests shell out to /usr/bin/sqlite3)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3

      - name: SDK tests (vitest)
        run: pnpm --filter @zcash-app/sdk test

      - name: zcash-dev tests
        run: |
          pnpm --filter @zcash-app/sdk build
          pnpm --filter zcash-dev build
          pnpm --filter zcash-dev test

  prepublish:
    name: napi prepublish (dry-run)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.5.3
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/core/artifacts

      - name: Copy native artifacts into npm per-platform dirs
        run: |
          pnpm --filter @zcash-app/core exec napi artifacts --output-dir artifacts
          ls -la packages/core/*.node packages/core/npm/*/*.node

      - name: Dry-run NAPI pre-publish
        run: pnpm --filter @zcash-app/core run prepublish

