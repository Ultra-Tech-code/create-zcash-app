name: zcash-regtest-zaino

services:
  zebra:
    image: ${ZEBRA_IMAGE:-zfnd/zebra:7.0.0}
    ports:
      - "127.0.0.1:${ZEBRA_RPC_PORT:-39232}:18232"
      - "127.0.0.1:${ZEBRA_HEALTH_PORT:-38080}:8080"
    volumes:
      - zebra-data:/home/zebra/.cache/zebra
      - ./zebra.toml:/home/zebra/.config/zebrad.toml:ro
    environment:
      - ZEBRA_NETWORK__NETWORK=Regtest
      - ZEBRA_RPC__LISTEN_ADDR=0.0.0.0:18232
      - ZEBRA_RPC__ENABLE_COOKIE_AUTH=false
      - ZEBRA_HEALTH__LISTEN_ADDR=0.0.0.0:8080
      - ZEBRA_HEALTH__MIN_CONNECTED_PEERS=0
      - ZEBRA_HEALTH__ENFORCE_ON_TEST_NETWORKS=false
      - ZEBRA_HEALTH__READY_MAX_BLOCKS_BEHIND=2
      - ZEBRA_TRACING__FILTER=info
      - RUST_LOG=info
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"method\":\"getblockchaininfo\",\"params\":[],\"id\":1}' http://127.0.0.1:18232 || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    stop_grace_period: 15s

  zaino:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ZAINO_IMAGE:-zaino:nu7-aaf8122a}
    depends_on:
      zebra:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ZAINO_GRPC_PORT:-38137}:8137"
    volumes:
      - ./zainod.toml:/etc/zaino/zainod.toml:ro
    command: ["start", "-c", "/etc/zaino/zainod.toml"]
    restart: unless-stopped

volumes:
  zebra-data:

