# Zallet v0.1.0-beta.4 configuration for standalone Zebra 7.0.0 spike on NU7 regtest.
# Uses direct zebra backend (no Zaino, no lightwalletd).

backend = "zebra"

[builder.limits]
orchard_actions = 250

[consensus]
network = "regtest"
regtest_nuparams = [
    "5ba81b19:1",      # Overwinter
    "76b809bb:1",      # Sapling
    "2bb40e60:1",      # Blossom
    "f5b9230b:1",      # Heartwood
    "e9ff75a6:1",      # Canopy
    "c2d6d0b4:2",      # NU5 (Orchard)
    "c8e71055:2",      # NU6
    "4dec4df0:2",      # NU6.1
    "5437f330:2",      # NU6.2
    "37a5165b:2",      # NU6.3 (Ironwood)
    "77190ad9:2",      # NU7
]

[database]

[external]

[features]
as_of_version = "0.1.0-beta.4"

[features.deprecated]

[features.experimental]

[indexer]
validator_address = "zebra-spike:18232"
validator_user = "zebra"
validator_password = "zebra"

[indexer.read_state_service]
grpc_address = "zebra-spike:8230"
zebra_state_path = "/zebra-cache"

[keystore]
encryption_identity = "/data/identity.txt"

[note_management]

[rpc]
bind = ["0.0.0.0:28232"]
allow_insecure_remote_bind = true
timeout = 30

[[rpc.auth]]
user = "zebra"
pwhash = "7998bac165a18a9bd37850f47e9f99d9$9040698a94619c779afff312bb1417731a2e0d750c8e8313943fc34fb152f389"

