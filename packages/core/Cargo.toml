[package]
name = "zcash-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
bip0039 = { version = "0.12", features = ["all-languages"] }
subtle = "2.4"
rand = "0.8"
orchard = "0.15.0"
zcash_address = "0.13.0"
zcash_keys = { version = "0.16.1", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = { version = "0.10.4", features = ["local-consensus"] }
zcash_primitives = "0.30.0"
hex = "0.4"
thiserror = "2"
zcash_client_backend = { version = "0.24.0", features = ["orchard"] }
zcash_note_encryption = "=0.4.2"

[dev-dependencies]
zcash_transparent = "0.10.0"

[build-dependencies]
napi-build = "2"
