# Gitleaks configuration
# Documented allowlist for mock test commitment roots, synthetic fixture hashes, and test logs

[extend]
useDefault = true

[[rules]]
id = "quicknode-token"
description = "QuickNode RPC URL with secret endpoint token"
regex = '''https://[a-zA-Z0-9-]+\.(?:quiknode\.pro|discover\.quiknode\.pro|quicknode\.com)/[a-zA-Z0-9_-]{8,}'''
secretGroup = 0

[allowlist]
description = "Ignore test fixtures, test log traces, and mock commitment roots in test suites"
paths = [
    '''packages/sdk/src/sync\.test\.ts''',
    '''packages/sdk/dist/sync\.test\.js''',
    '''packages/core/tests/fixtures/.*''',
    '''packages/core/tests/logs/.*'''
]
